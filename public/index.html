<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KANEZ</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 라틴 디스플레이 서체는 /fonts 에서 직접 서빙합니다(인앱 브라우저 대응). 한글만 구글 폰트를 씁니다. -->
  <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <span class="rail rail-l"></span><span class="rail rail-r"></span>
  </div>

  <header class="nav">
    <div class="nav-inner">
      <a class="wordmark" href="#/" data-site-name>KANEZ</a>
      <div class="nav-right">
        <button class="search-toggle" aria-label="검색" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/>
          </svg>
        </button>
        <button class="nav-toggle" aria-label="메뉴" aria-expanded="false"><span></span><span></span></button>
      </div>
      <nav class="nav-links">
        <a href="#/" data-scroll="#collections">Collections</a>
        <a href="#/photos">Photos</a>
        <a href="#/models">Models</a>
        <a href="#/characters">Characters</a>
        <a href="#/about">About</a>
      </nav>
    </div>
  </header>

  <div class="search-scrim" id="searchScrim" aria-hidden="true"></div>
  <div class="search-panel" id="searchPanel" role="dialog" aria-modal="true" aria-label="검색">
    <div class="search-inner">
      <div class="search-bar">
        <span class="search-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/>
          </svg>
        </span>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
               placeholder="모델 · 캐릭터 · 작품 · 행사명" aria-label="검색어" />
        <button class="search-esc" id="searchClose">ESC</button>
      </div>
      <div class="search-results" id="searchResults" role="listbox" aria-label="검색 결과"></div>
      <div class="search-hint">
        <span>↑↓ 이동</span><span>↵ 열기</span><span>ESC 닫기</span>
        <span class="spacer">/ 키로 언제든 검색</span>
      </div>
    </div>
  </div>

  <main class="wrap" id="main"></main>

  <footer class="site">
    <a href="admin.html">Photos © <span data-site-name>KANEZ</span> — please ask before using</a>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
